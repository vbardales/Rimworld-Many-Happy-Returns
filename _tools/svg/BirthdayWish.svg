<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Social bubble symbol: a birthday cake. Two tones only, like the vanilla speech symbols:
       white for what carries the silhouette, grey for the fill.
       Order matters: the cake body is painted BEFORE the icing, otherwise it covers the drips
       and they read as holes. -->

  <!-- flame -->
  <path d="M32 5 C33 11 37 13 37 17 a5 5 0 0 1 -10 0 c0 -4 4 -6 5 -12 z" fill="#FFFFFF"/>

  <!-- candle -->
  <rect x="29.5" y="21" width="5" height="11" fill="#BFBFBF"/>

  <!-- cake body, reaching up under the icing so the drips fall onto it -->
  <path d="M11 34 H53 V51 H11 Z" fill="#BFBFBF"/>

  <!-- dripping icing -->
  <path d="M11 29 H53 V37 q-5.25 5 -10.5 0 q-5.25 5 -10.5 0 q-5.25 5 -10.5 0 q-5.25 5 -10.5 0 Z" fill="#FFFFFF"/>

  <!-- plate -->
  <rect x="6" y="51" width="52" height="5" rx="2.5" fill="#FFFFFF"/>
</svg>
